name: Sync mirrors

# Pushes this repository's contents into the FoG_Walkways/ subdirectory of
# each mirror listed below. The copy happens entirely between GitHub servers,
# so it costs no local upload bandwidth.
#
# Requires a repository secret MIRROR_TOKEN: a fine-grained personal access
# token with Contents: read and write on this repository and on every mirror.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sync-mirrors
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mirror:
          - LehighVRHealth/VRProjects
          - shinnew9/FoG
    name: ${{ matrix.mirror }}
    steps:
      - name: Mirror into ${{ matrix.mirror }}
        env:
          TOKEN: ${{ secrets.MIRROR_TOKEN }}
          MIRROR: ${{ matrix.mirror }}
          SOURCE: ${{ github.repository }}
          PREFIX: FoG_Walkways
        run: |
          set -euo pipefail

          if [ -z "${TOKEN}" ]; then
            echo "::error::MIRROR_TOKEN is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git clone --quiet "https://x-access-token:${TOKEN}@github.com/${MIRROR}.git" mirror
          cd mirror

          git fetch --quiet "https://x-access-token:${TOKEN}@github.com/${SOURCE}.git" main
          SRC=$(git rev-parse FETCH_HEAD)
          SRC_TREE=$(git rev-parse "FETCH_HEAD^{tree}")
          CUR_TREE=$(git rev-parse --verify --quiet "HEAD:${PREFIX}" || true)

          if [ "${SRC_TREE}" = "${CUR_TREE}" ]; then
            echo "${MIRROR} already matches ${SOURCE}@${SRC} - nothing to do."
            exit 0
          fi

          BASE=$(git rev-parse HEAD)

          # Replace the whole prefix rather than merging file by file: the
          # source repository is the single source of truth for it, so there
          # is nothing in the mirror's copy worth preserving.
          if [ -n "${CUR_TREE}" ]; then
            git rm -r --quiet --cached "${PREFIX}"
          fi
          git read-tree --prefix="${PREFIX}/" "${SRC}"
          TREE=$(git write-tree)

          # Two parents and the git-subtree-* trailers keep this indistinguishable
          # from `git subtree pull`, so the mirror stays usable by hand.
          MSG=$(printf 'Sync %s/ from %s@%s\n\ngit-subtree-dir: %s\ngit-subtree-mainline: %s\ngit-subtree-split: %s\n' \
            "${PREFIX}" "${SOURCE}" "$(git rev-parse --short "${SRC}")" "${PREFIX}" "${BASE}" "${SRC}")
          NEW=$(git commit-tree "${TREE}" -p "${BASE}" -p "${SRC}" -m "${MSG}")

          git push --quiet origin "${NEW}:refs/heads/main"
          echo "Updated ${MIRROR}: ${BASE} -> ${NEW}"
